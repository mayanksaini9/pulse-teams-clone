<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="50%" stopColor="#d946ef" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="1" />
      <stop offset="100%" stopColor="#f472b6" stopOpacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Glowing aura background -->
  <circle cx="50" cy="50" r="38" fill="rgba(139, 92, 246, 0.15)" filter="url(#neonGlow)" />

  <!-- Vertical bar for letter P -->
  <rect x="26" y="20" width="12" height="60" rx="6" fill="url(#stemGrad)" />

  <!-- Curved loop for letter P -->
  <path 
    d="M38,20 H58 C72,20 80,28 80,41 C80,54 72,62 58,62 H38 Z" 
    fill="url(#loopGrad)" 
    filter="url(#neonGlow)"
  />

  <!-- Inner void subtraction for P shape -->
  <path 
    d="M38,32 H54 C61,32 66,35 66,41 C66,47 61,50 54,50 H38 Z" 
    fill="#0f111a" 
  />

  <!-- Pulsing dynamic heartbeat line -->
  <path 
    d="M48,50 L54,43 L60,53 L66,35 L72,48 L80,44" 
    fill="none" 
    stroke="url(#pulseGrad)" 
    strokeWidth="4.5" 
    strokeLinecap="round" 
    strokeLinejoin="round"
    filter="url(#neonGlow)"
  />
</svg>
